</body><script>var jnRs=[];
sDiag=[];   sDiag[0]="Reqs w/o answer=";
            sDiag[1]="Bad CRC . . . .=";
            sDiag[2]="Exchange w/oErr=";
function dt2ys(d){var s,m,e;s=d.getFullYear();m=d.getMonth()+1;if(m<10)s+='0'+m;else s+=''+m;e=d.getDate();if(e<10)s+='0'+e;else s+=''+e;return s;}
function dp2fn(d,p){return 'SisGwNG_port'+p+'.txt'}//return dt2ys(d)+'_SisGwNG_MbSlaves_port'+p+'.txt';}
function csv2jn(csv){var i,j,s,hs,res=[],Ls=csv.split("\n");s=Ls[0];hs=s.split(",");//s=s.substring(0,s.length-1);
    for(i=1;i<Ls.length;i++){var o={};s=Ls[i].split(",");for(j=0;j<hs.length;j++){o[hs[j]]=s[j];} res.push(o);} return res;}    
function hms2tims(hms){return hms.substring(8,10)+':'+hms.substring(10,12)+':'+hms.substring(12,14)}
function mbRtuSlaveStatus(id,ad){var s="id"+id+" slave"+ad+" ",r,rr=jnRs.length-1;
    if(0<rr){for(r=rr-1;0<=r;r--){if(ad==jnRs[r]['Slav']){s+=jnRs[r]['status'];break;}} return s;}}
function spDiagUpd(sp,ids,slavs){var rr=jnRs.length-1;if(rr<1)return;
    var s="<u>SerialPort <b>"+sp+"</b></u> "+hms2tims(jnRs[rr-1]['hhmmss'])+"<br>";
    s+=sDiag[0]+jnRs[rr-1]['noAns']+"<br>";
    s+=sDiag[1]+jnRs[rr-1]['crc']  +"<br>";
    s+=sDiag[2]+jnRs[rr-1]['noErr']+"<br><br>";
    var i,n=slavs.length;for(i=0;i<n;i++)s+=mbRtuSlaveStatus(ids[i],slavs[i])+"<br>";
    dv=document.getElementById('dvsp'+sp);dv.innerHTML=s;}
async function rLogCsv(dt,sp){var fn=dp2fn(dt,sp);console.log(fn);jnRs=[]
    await fetch(fn,{headers:{'Access-Control-Allow-Origin':'*','Cache-Control':'no-store','Pragma':'no-cache'}})
    .then(r=>r.text()).then(csv=>{jnRs=csv2jn(csv);return jnRs;}).catch(e=>{console.error('ERRfetchCSVfile:',e);});}//jnRs[nn]['DateTime']
async function spMbRtuSlaves_diag(){var sp,dv;
    sp=1;await rLogCsv(new Date(),sp);spDiagUpd(sp,[ 1, 2, 3, 4, 5, 6],[10,11,12,13,14,15]);//console.log(jnRs.length);console.log(jnRs);
    sp=2;await rLogCsv(new Date(),sp);spDiagUpd(sp,[ 7, 8, 9,10,11,12],[20,21,22,23,24,25]);
    sp=3;await rLogCsv(new Date(),sp);spDiagUpd(sp,[13,14,15,16,17,18],[30,31,32,33,34,35]);
    sp=4;await rLogCsv(new Date(),sp);spDiagUpd(sp,[19,20,21,22,23,24],[40,41,42,43,44,45]);
    sp=5;await rLogCsv(new Date(),sp);spDiagUpd(sp,[25,26,27,28],      [50,51,52,53]);
    sp=6;await rLogCsv(new Date(),sp);spDiagUpd(sp,[29],               [60]);
    sp=7;await rLogCsv(new Date(),sp);spDiagUpd(sp,[30,31],            [70,71]);
    sp=8;await rLogCsv(new Date(),sp);spDiagUpd(sp,[32,33],            [80,81]);}
function upds(){setInterval(spMbRtuSlaves_diag,1000);}
